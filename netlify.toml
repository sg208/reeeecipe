[build]
  command = "pnpm install --frozen-lockfile && pnpm generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Every route is prerendered, so unknown paths get a real 404 in the
# visitor's language. Netlify serves /404.html for everything else.
[[redirects]]
  from = "/es/*"
  to = "/es/404.html"
  status = 404

[[redirects]]
  from = "/nl/*"
  to = "/nl/404.html"
  status = 404

